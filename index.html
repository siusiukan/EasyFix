<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好易搵電腦工程有限公司 - 專業上門電腦服務與工程師平台</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // 初始化 EmailJS (使用您的 Public Key)
            emailjs.init({
              publicKey: "MrjHi6e94tgP_rXoS",
            });
        })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
        @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-radar { animation: radar-sweep 2s linear infinite; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <div class="bg-slate-900 text-slate-200 py-2 px-4 text-xs md:text-sm border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-semibold border border-emerald-500/30">
                    <i class="fa-solid fa-server mr-1.5 text-xs"></i> 系統背景 SMTP 直連加密
                </span>
                <span class="text-slate-400 hidden sm:inline">好易搵電腦工程有限公司 - 專業工程師配對平台</span>
            </div>
            
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button onclick="switchView('customer')" id="btn-view-customer" class="px-3 py-1 rounded-md text-xs font-medium transition-all duration-200 bg-brand-600 text-white shadow-sm">
                    <i class="fa-solid fa-user-gear mr-1"></i> 客戶服務端
                </button>
                <button onclick="switchView('engineer')" id="btn-view-engineer" class="px-3 py-1 rounded-md text-xs font-medium transition-all duration-200 text-slate-300 hover:text-white hover:bg-slate-700">
                    <i class="fa-solid fa-helmet-safety mr-1"></i> 工程師工作台
                    <span id="eng-notification-badge" class="hidden ml-1 px-1.5 py-0.2 bg-red-500 text-white rounded-full text-[10px] animate-pulse">1</span>
                </button>
                <button onclick="switchView('join')" id="btn-view-join" class="px-3 py-1 rounded-md text-xs font-medium transition-all duration-200 text-slate-300 hover:text-white hover:bg-slate-700">
                    <i class="fa-solid fa-user-plus mr-1"></i> 工程師加盟專頁
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none px-4 sm:px-0"></div>

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-[41px] z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('customer')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-laptop-code text-xl"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-tight text-slate-900 block leading-tight">好易搵電腦工程</span>
                    <span class="text-[10px] tracking-widest text-brand-600 uppercase font-semibold block">EasyFix IT Solutions Ltd.</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div id="user-status-display" class="flex items-center gap-2">
                    <span class="text-xs bg-slate-100 text-slate-600 px-3 py-2 rounded-full border border-slate-200 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span id="current-user-name">客戶：陳先生 (九龍城區)</span>
                    </span>
                    <button onclick="openBookingModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wrench"></i> 即時預約上門
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="view-customer" class="flex-grow">
        <section class="relative bg-slate-900 text-white overflow-hidden py-16 md:py-24">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight mb-6">
                    專業電腦技術人員 <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-300 to-sky-200">上門檢查與維修服務</span>
                </h1>
                <p class="text-slate-300 text-base md:text-lg mb-8 max-w-2xl mx-auto">網絡故障、硬體升級、系統重設或軟件安裝？只需一鍵下單，系統自動為您配對距離最近的認證工程師。</p>
                <button onclick="switchView('join')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-6 py-3.5 rounded-xl border border-slate-700 transition">
                    登記成為維修工程師
                </button>
            </div>
        </section>
    </main>

    <main id="view-engineer" class="flex-grow hidden bg-slate-900 text-slate-100 py-8 px-4">
        <div class="max-w-3xl mx-auto bg-slate-800 rounded-3xl border border-slate-700 p-6 shadow-2xl text-center">
            <h2 class="text-xl font-bold text-white mb-2">工程師工作台 (測試用)</h2>
            <p class="text-slate-400 text-sm">此頁面僅供展示工程師接單狀態。</p>
        </div>
    </main>

    <div id="view-join" class="flex-grow hidden bg-slate-50 py-12">
        <div class="max-w-3xl mx-auto px-4">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-lg p-6 sm:p-10">
                <div class="border-b border-slate-200 pb-6 mb-8">
                    <h2 class="text-2xl font-bold text-slate-900">提交工程師加盟申請</h2>
                    <p class="text-slate-500 text-sm mt-1">請填寫您的基本資料，完成後將透過 EmailJS 背景自動發送給 HR。</p>
                </div>

                <form id="engineer-application-form" onsubmit="handleEmailJSDispatch(event)" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">中文/英文全名 *</label>
                            <input type="text" id="app-fullname" required placeholder="例如：陳大文" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">聯絡電話 *</label>
                            <input type="tel" id="app-phone" required placeholder="例如：9123 4567" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">電郵地址 *</label>
                            <input type="email" id="app-email" required placeholder="david@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">IT 工作經驗 (年) *</label>
                            <input type="number" id="app-experience" min="0" required placeholder="例如：3" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">核心服務專長 *</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg cursor-pointer hover:bg-brand-50 transition">
                                <input type="checkbox" name="專長" value="硬件組裝維修" class="w-4 h-4 text-brand-600 rounded border-slate-300"> <span class="text-sm">硬件組裝維修</span>
                            </label>
                            <label class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg cursor-pointer hover:bg-brand-50 transition">
                                <input type="checkbox" name="專長" value="網絡/Router設定" class="w-4 h-4 text-brand-600 rounded border-slate-300"> <span class="text-sm">網絡/Router設定</span>
                            </label>
                            <!-- 可以自行新增更多專長 -->
                        </div>
                    </div>

                    <!-- 將原本的 text input 替換為檔案上傳介面 -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">上傳個人履歷 (PDF/Word) (選填)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition relative group">
                            <input type="file" id="app-resume-file" accept=".pdf,.doc,.docx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFileUpload(this)">
                            <div class="flex flex-col items-center gap-2 text-slate-500">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-brand-500"></i>
                                <p class="text-sm font-medium" id="upload-instruction">點擊或拖曳履歷檔案至此處</p>
                                <p class="text-xs text-slate-400">支援 .pdf, .doc, .docx</p>
                            </div>
                        </div>
                        <!-- 選擇檔案後顯示檔名的區塊 -->
                        <div id="file-selected-display" class="hidden mt-2 p-3 bg-brand-50 border border-brand-200 rounded-lg flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-2 text-sm text-brand-800 font-medium truncate">
                                <i class="fa-solid fa-file-lines text-brand-600"></i>
                                <span id="file-name-span" class="truncate">MyResume.pdf</span>
                            </div>
                            <button type="button" onclick="removeFile()" class="text-slate-400 hover:text-red-500 px-2 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-200">
                        <button type="submit" id="submit-apply-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition text-lg flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> 背景傳送申請至 HR 信箱
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="booking-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 text-center">
            <h3 class="text-xl font-bold mb-4">預約功能示範</h3>
            <button onclick="closeBookingModal()" class="px-4 py-2 bg-slate-200 rounded-lg">關閉</button>
        </div>
    </div>

    <script>
        function openBookingModal() { document.getElementById('booking-modal').classList.remove('hidden'); }
        function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); }

        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let colorCls = type === 'success' ? 'border-emerald-500 bg-slate-800 text-emerald-400' : 'border-amber-500 bg-slate-800 text-amber-400';
            toast.className = `flex items-start gap-3 p-4 rounded-xl border-l-4 shadow-lg mb-2 transform transition-all duration-300 ${colorCls}`;
            toast.innerHTML = `<div><h5 class="text-sm font-bold text-white mb-0.5">${title}</h5><p class="text-xs opacity-90">${message}</p></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 7000);
        }

        function switchView(viewName) {
            ['view-customer', 'view-join', 'view-engineer'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 新增：處理檔案選擇的介面變化
        function handleFileUpload(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('file-name-span').innerText = file.name;
                document.getElementById('file-selected-display').classList.remove('hidden');
                document.getElementById('file-selected-display').classList.add('flex');
            }
        }

        // 新增：移除已選檔案
        function removeFile() {
            document.getElementById('app-resume-file').value = '';
            document.getElementById('file-selected-display').classList.add('hidden');
            document.getElementById('file-selected-display').classList.remove('flex');
        }

        // 核心發信函式
        function handleEmailJSDispatch(e) {
            e.preventDefault(); // 阻擋表單預設重整頁面的行為
            
            // 1. 取得所有輸入框的值
            const fullName = document.getElementById('app-fullname').value;
            const phone = document.getElementById('app-phone').value;
            const email = document.getElementById('app-email').value;
            const experience = document.getElementById('app-experience').value;
            
            // 讀取真實檔案輸入框的檔名
            const fileInput = document.getElementById('app-resume-file');
            const resumeFileName = (fileInput.files.length > 0) ? fileInput.files[0].name : '未上傳履歷';
            
            const checkedSkills = Array.from(document.querySelectorAll('input[name="專長"]:checked'))
                                       .map(cb => cb.value)
                                       .join(', ') || '未選擇專長';

            // 2. 更改按鈕狀態，顯示 Loading
            const submitBtn = document.getElementById('submit-apply-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 正在安全加密發送中...`;

            // 3. 準備傳給 EmailJS 的參數物件
            // 這裡的 Key (例如 name, phone, email) 必須與 EmailJS 範本中的 {{name}} 對齊！
            const templateParams = {
                name: fullName,
                phone: phone,
                email: email,
                experience: experience,
                skills: checkedSkills,
                resume: resumeFileName
            };

            console.log("嘗試發送的資料:", templateParams);

            // 4. 呼叫 EmailJS API 發送
            emailjs.send('service_agv98ua', 'template_ljom40q', templateParams)
                .then(function(response) {
                    console.log('API 回應成功:', response);
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 背景傳送申請至 HR 信箱`;
                    
                    showToast('✅ 申請已在背景成功寄出！', `我們已將您的資料發送至信箱，請留意回覆。`, 'success');
                    document.getElementById('engineer-application-form').reset();
                    
                })
                .catch(function(error) {
                    console.error('API 拒絕發送:', error);
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 重新嘗試發送`;
                    
                    // 詳細錯誤提示，幫助排錯
                    let errorMsg = error.text || error.message || '未知錯誤';
                    if(error.status === 403) {
                        errorMsg = "權限遭拒(403)。請前往 EmailJS 後台的 Security 標籤，確認「Domain List」是否清空！";
                    }
                    
                    showToast('❌ 發送失敗', `錯誤代碼: ${error.status}，原因: ${errorMsg}`, 'warning');
                });
        }
    </script>
</body>
</html>
